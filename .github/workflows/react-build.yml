name: React Build

on:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coreui-free-react-admin-template-main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coreui-free-react-admin-template-main/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build React app
        run: npm run build
